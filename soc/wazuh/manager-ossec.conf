# =============================================================================
# Wazuh MANAGER config snippet — add these blocks to /var/ossec/etc/ossec.conf
# on wazuhVM, then `sudo systemctl restart wazuh-manager`.
# =============================================================================

<ossec_config>

  <!-- ---------- Active Response: block attacker IPs in Azure NSG ---------- -->
  <command>
    <name>block-ip</name>
    <executable>block-ip-azure.sh</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>unblock-ip</name>
    <executable>unblock-ip-azure.sh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <active-response>
    <command>block-ip</command>
    <location>local</location>
    <rules_id>100110,100210,100900</rules_id>
    <timeout>14400</timeout>          <!-- 4h; manager auto-fires unblock-ip -->
  </active-response>

  <!-- ---------- Integrator: create a ticket for every noteworthy alert ---------- -->
  <integration>
    <name>custom-ticket</name>
    <hook_url>https://YOUR-TICKET-ENDPOINT.example/soc/tickets</hook_url>
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>

</ossec_config>
