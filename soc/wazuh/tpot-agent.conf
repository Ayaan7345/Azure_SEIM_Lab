# =============================================================================
# T-Pot agent config fragment — add this inside <ossec_config> on honeyVM
# Path on the host: /var/ossec/etc/ossec.conf  (or /opt/tpot/etc if using the
# tpot-provided agent). Install agent with WAZUH_MANAGER set to the wazuhVM IP.
# =============================================================================

<ossec_config>
  <client>
    <server>
      <address>WAZUH_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
  </client>

  <!-- Local honeypot JSON logs collected by T-Pot under /data/ -->
  <localfile>
    <log_format>json</log_format>
    <location>/data/cowrie/log/cowrie.json</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/data/dionaea/log/dionaea.json</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/data/honeytrap/log/attackers.json</location>
  </localfile>

  <!-- Suricata IDS alerts (T-Pot ships Suricata) -->
  <localfile>
    <log_format>json</log_format>
    <location>/data/suricata/log/eve.json</location>
  </localfile>

  <!-- T-Pot's own auth log for the honeypot host -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
</ossec_config>
